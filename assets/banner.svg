<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 350"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><style>@keyframes pulse{0%{transform:scale(1);opacity:.3}}@keyframes float{0%{transform:translateY(0)}}.pulse-line{stroke-dasharray:8 8;animation:dash 30s linear infinite}.glow-circle{animation:pulse 4s ease-in-out infinite alternate}.floating-pill{animation:float 6s ease-in-out infinite alternate}</style></defs><rect width="1200" height="350" fill="url(#bgGrad)" rx="16"/><g stroke="#fff" stroke-width="1" opacity=".05"><path d="M0 50h1200M0 100h1200M0 150h1200M0 200h1200M0 250h1200M0 300h1200"/><path d="M100 0v350M200 0v350M300 0v350M400 0v350M500 0v350M600 0v350M700 0v350M800 0v350M900 0v350M1000 0v350M1100 0v350"/></g><circle cx="950" cy="100" r="120" fill="#8b5cf6" class="glow-circle" filter="blur(60px)" opacity=".25"/><circle cx="1050" cy="250" r="90" fill="#3b82f6" class="glow-circle" filter="blur(50px)" opacity=".2"/><path fill="none" stroke="url(#accentGrad)" stroke-width="3" d="M 650 260 Q 750 180, 850 220 T 1050 120 T 1180 140" class="pulse-line" opacity=".6"/><path fill="none" stroke="#3b82f6" stroke-width="1.5" d="M 650 280 Q 750 210, 850 240 T 1050 160 T 1180 170" opacity=".3"/><g class="floating-pill" transform="translate(720, 60)"><rect width="180" height="50" fill="url(#cardGrad)" stroke="#fff" stroke-opacity=".15" stroke-width="1" rx="12"/><circle cx="30" cy="25"