<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Dynamic Pulse Animations -->
    <style>
      .pulse-line {
        stroke-dasharray: 8 8;
        animation: dash 30s linear infinite;
      }
      .glow-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .floating-pill {
        animation: float 6s ease-in-out infinite alternate;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -1000;
        }
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.3; }
        100% { transform: scale(1.15); opacity: 0.7; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bgGrad)" rx="16" />
  
  <!-- Grid Pattern overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M0 50h1200M0 100h1200M0 150h1200M0 200h1200M0 250h1200M0 300h1200" />
    <path d="M100 0v350M200 0v350M300 0v350M400 0v350M500 0v350M600 0v350M700 0v350M800 0v350M900 0v350M1000 0v350M1100 0v350" />
  </g>

  <!-- Dynamic / Animated Background Graphics (Behind text and foreground) -->
  <!-- Glowing Nodes -->
  <circle cx="950" cy="100" r="120" fill="#8b5cf6" filter="blur(60px)" opacity="0.25" class="glow-circle" />
  <circle cx="1050" cy="250" r="90" fill="#3b82f6" filter="blur(50px)" opacity="0.2" class="glow-circle" />

  <!-- Animated Chart Wave (Background Visual) -->
  <path class="pulse-line" d="M 650 260 Q 750 180, 850 220 T 1050 120 T 1180 140" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.6" />
  <path d="M 650 280 Q 750 210, 850 240 T 1050 160 T 1180 170" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.3" />

  <!-- Background Financial Pill Cards (Shifted to right so title remains clear) -->
  <g transform="translate(720, 60)" class="floating-pill">
    <rect width="180" height="50" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <circle cx="30" cy="25" r="10" fill="#10b981" opacity="0.8" />
    <text x="50" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">CAGR FORECAST</text>
    <text x="50" y="37" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">+11.4% YoY</text>
  </g>

  <g transform="translate(930, 160)" class="floating-pill" style="animation-delay: -3s;">
    <rect width="190" height="50" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <circle cx="30" cy="25" r="10" fill="#3b82f6" opacity="0.8" />
    <text x="50" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">MARKET TAM (2026)</text>
    <text x="50" y="37" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">$12.5 Billion</text>
  </g>

  <!-- FOREGROUND TEXT AND HEADINGS (Guaranteed readable and unobstructed) -->
  <!-- Top Accent Bar -->
  <rect x="60" y="55" width="120" height="6" rx="3" fill="url(#accentGrad)" />

  <!-- Category Badge -->
  <rect x="60" y="75" width="280" height="28" rx="14" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1" />
  <text x="75" y="94" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">CURATED FP&amp;A ECOSYSTEM</text>

  <!-- Main Title -->
  <text x="60" y="155" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">Awesome Financial Planning</text>
  <text x="60" y="200" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">&amp; Analysis (FP&amp;A)</text>

  <!-- Subtitle -->
  <text x="60" y="245" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
    The definitive guide to SaaS platforms, driver-based modeling &amp; open-source finance tools.
  </text>

  <!-- Tag Pills Foreground -->
  <g transform="translate(60, 275)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="65" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">💡 SaaS Platforms</text>

    <!-- Tag 2 -->
    <rect x="140" y="0" width="140" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="210" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ Open-Source BI</text>

    <!-- Tag 3 -->
    <rect x="290" y="0" width="150" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="365" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">📊 Financial Modeling</text>
  </g>
</svg>
